name: release

# Builds wheels and an sdist. Publishing is a separate, explicit act.
#
# A `v*` tag builds the artefacts for every platform and uploads them to the run; it publishes nothing.
# To publish, dispatch this workflow with `publish: true` - that job uses PyPI's trusted publishing
# (OIDC), so no API token is stored in this repository, and it needs the project's trusted publisher to
# name this repository, this workflow file and the `pypi` environment (docs/registry-setup.md).
#
# The gate exists because 0.1.0 was published by hand: a `v0.1.0` tag would otherwise re-upload files
# PyPI already has, which it rejects.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the built artefacts to PyPI (needs the project's trusted publisher)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wheels-linux:
    name: Wheels linux ${{ matrix.target }} (${{ matrix.manylinux }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64, manylinux: auto }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { runner: ubuntu-24.04, target: x86_64, manylinux: musllinux_1_2 }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: PyO3/maturin-action@v1.49.4
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - name: Free-threaded CPython 3.14t wheel (no GIL; abi3 does not apply)
        uses: PyO3/maturin-action@v1.49.4
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist -i python3.14t
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist/*.whl

  wheels-macos:
    name: Wheels macOS ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: macos-15, target: aarch64 }
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: PyO3/maturin-action@v1.49.4
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*.whl

  wheels-windows:
    name: Wheels Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: PyO3/maturin-action@v1.49.4
        with:
          target: x64
          args: --release --out dist
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: wheels-windows-x64
          path: dist/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: PyO3/maturin-action@v1.49.4
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-pypi:
    name: Publish to PyPI
    # Publishing is explicit: dispatch the workflow with `publish: true`. A tag builds the artefacts and
    # uploads them to the run, but never publishes - 0.1.0 was published by hand, so a v* tag for it
    # would otherwise be rejected by PyPI as a duplicate upload. (Trusted publishing still needs the
    # project's publisher configured; see docs/registry-setup.md.)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: [wheels-linux, wheels-macos, wheels-windows, sdist]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4.6.2
        with:
          path: dist
          merge-multiple: true
      - name: Show what will be uploaded
        run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # The console script and the package must come from the same build.
          attestations: false
