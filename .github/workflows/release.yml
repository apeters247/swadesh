name: release

# Builds wheels and an sdist, and publishes them to PyPI when a `v*` tag is pushed.
#
# Publishing uses PyPI's trusted publishing (OIDC), so no API token is stored in this repository. Two
# things must exist on the PyPI side first, per LAUNCH.md: the project `swadesh` with a (pending)
# trusted publisher naming this repository, this workflow file and the `pypi` environment below.
#
# `workflow_dispatch` builds the artefacts and publishes nothing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels-linux:
    name: Wheels linux ${{ matrix.target }} (${{ matrix.manylinux }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64, manylinux: auto }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { runner: ubuntu-24.04, target: x86_64, manylinux: musllinux_1_2 }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: PyO3/maturin-action@v1.49.4
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - name: Free-threaded CPython 3.14t wheel (no GIL; abi3 does not apply)
        uses: PyO3/maturin-action@v1.49.4
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist -i python3.14t
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist/*.whl

  wheels-macos:
    name: Wheels macOS ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: macos-15, target: aarch64 }
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: PyO3/maturin-action@v1.49.4
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*.whl

  wheels-windows:
    name: Wheels Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: PyO3/maturin-action@v1.49.4
        with:
          target: x64
          args: --release --out dist
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: wheels-windows-x64
          path: dist/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: PyO3/maturin-action@v1.49.4
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-pypi:
    name: Publish to PyPI
    # Only a tag publishes; a manual run just builds.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels-linux, wheels-macos, wheels-windows, sdist]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4.6.2
        with:
          path: dist
          merge-multiple: true
      - name: Show what will be uploaded
        run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # The console script and the package must come from the same build.
          attestations: false
