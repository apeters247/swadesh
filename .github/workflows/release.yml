name: release

# This workflow builds wheels and an sdist as workflow artefacts only. It does not publish
# anywhere: swadesh is not released to PyPI or crates.io, and the repository is private.
# Do not add a publish job. Pushing a v* tag does nothing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels-linux:
    name: Wheels linux ${{ matrix.target }} (${{ matrix.manylinux }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64, manylinux: auto }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { runner: ubuntu-24.04, target: x86_64, manylinux: musllinux_1_2 }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: PyO3/maturin-action@v1.49.4
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - name: Free-threaded CPython 3.14t wheel (no GIL; abi3 does not apply)
        uses: PyO3/maturin-action@v1.49.4
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist -i python3.14t
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist/*.whl

  wheels-macos:
    name: Wheels macOS ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: macos-15, target: aarch64 }
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: PyO3/maturin-action@v1.49.4
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*.whl

  wheels-windows:
    name: Wheels Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: PyO3/maturin-action@v1.49.4
        with:
          target: x64
          args: --release --out dist
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: wheels-windows-x64
          path: dist/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: PyO3/maturin-action@v1.49.4
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: sdist
          path: dist/*.tar.gz

