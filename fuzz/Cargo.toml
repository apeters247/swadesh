[package]
name = "swadesh-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
swadesh-core = { path = "../crates/swadesh-core" }
swadesh-cli = { path = "../crates/swadesh-cli" }

[[bin]]
name = "tok_13a"
path = "fuzz_targets/tok_13a.rs"
test = false
doc = false
bench = false

