[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "swadesh"
description = "Bit-exact sacreBLEU-compatible BLEU/chrF/TER in Rust, AGPL-3.0; commercial licence available."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = ["numpy>=1.24"]
dynamic = ["version"]
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
keywords = ["bleu", "chrf", "sacrebleu", "machine-translation", "evaluation", "nlp", "llm"]

[project.optional-dependencies]
# The library API -- BLEU, chrF, chrF++, TER, PairedTest -- needs none of these. sacreBLEU is needed
# by patch(), the `swadesh` command line, verify.py and the six tokenizers that use mecab or
# sentencepiece; the test suite needs it as the oracle it compares against.
mcp = ["mcp>=2"]
sacrebleu = ["sacrebleu==2.6.0"]
test = ["sacrebleu==2.6.0", "pytest", "hypothesis"]

[project.urls]
Homepage = "https://github.com/apeters247/swadesh"
Source = "https://github.com/apeters247/swadesh"
Issues = "https://github.com/apeters247/swadesh/issues"
Documentation = "https://github.com/apeters247/swadesh/blob/master/docs/guide.md"

[project.scripts]
swadesh = "swadesh.cli:main"
swadesh-mcp = "swadesh.mcp_server:main"

[tool.maturin]
manifest-path = "crates/swadesh-py/Cargo.toml"
python-source = "python"
module-name = "swadesh._swadesh"
features = ["pyo3/extension-module"]
