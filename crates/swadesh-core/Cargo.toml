[package]
name = "swadesh-core"
description = "Bit-exact, parallel sacreBLEU (BLEU, chrF, chrF++) in Rust"
readme = "README.md"
keywords = ["bleu", "chrf", "sacrebleu", "machine-translation", "evaluation"]
categories = ["text-processing", "science"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rayon = { version = "1", optional = true }
rustc-hash = "2"
num-bigint = "0.4"
num-traits = "0.2"
memchr = "2"

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
