[package]
name = "swadesh-cli"
description = "Standalone sacreBLEU-compatible BLEU and chrF command line (no Python needed)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "swadesh_cli"
path = "src/lib.rs"

[[bin]]
name = "swadesh"
path = "src/main.rs"

[dependencies]
swadesh-core = { path = "../swadesh-core", default-features = false }

[features]
default = ["parallel"]
parallel = ["swadesh-core/parallel"]
