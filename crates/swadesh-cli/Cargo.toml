[package]
name = "swadesh-cli"
description = "Standalone sacreBLEU-compatible BLEU and chrF command line (no Python needed)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "swadesh_cli"
path = "src/lib.rs"

[[bin]]
name = "swadesh"
path = "src/main.rs"

[dependencies]
swadesh-core = { version = "0.1.0", path = "../swadesh-core", default-features = false }
# The downloader (PLAN.md D-2): fetching a test set's archive, verifying its md5, unpacking it. Off
# by default nowhere - it is in `default` - but `--no-default-features` keeps the binary free of
# third-party crates, which is what `crates/swadesh-wasm` builds and what a cache-only build wants.
ureq = { version = "2", optional = true, default-features = false, features = ["tls", "gzip"] }
# flate2 is not behind the downloader feature: `-i x.gz` decompresses a `.gz` input too, which
# sacreBLEU does transparently and the CLI parity suite compares.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", optional = true }
md-5 = { version = "0.10", optional = true }

[features]
default = ["parallel", "downloader"]
parallel = ["swadesh-core/parallel"]
downloader = ["dep:ureq", "dep:tar", "dep:md-5"]
